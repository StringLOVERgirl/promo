<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>svg</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      /* box-sizing: border-box; */
    }



    svg {
      border: solid 3px greenyellow;
      height: 70vh;
      width: 70vw;

    
    }
    .inner { 
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;

    
    
  }


    #cercle1 {
      fill: url(#greenyellowblack);
/* transform: translateZ(-250px); */
    }

    text {
      /* mix-blend-mode: difference; */
    }
    h1 { 
      font-family:raleway;
      font-weight: 300;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      transform: translate(-50%,-50%);
    }
  </style>
</head>
<body>
  <!-- все единицы адаптивны в первую очередь отнитситенло друг друга 
  у них нет исходных автоматических значений по отношению к реальному размеру
ни ни 100 они работают по отношению друг к другу-->

<h1>raleway eng</h1>
  <div class="inner">
<svg viewBox="0 0 10 10">
  <!--  в теге дефс буду элементы которые не отображаютяс но которы можно исопльзовать 
  с пмощью тега юс (не только градиенты) -->
  <defs>
    <!-- свойство ниже применяет машстбаирует его градиент те под фигуру а по умолчанию под
    контейнер -->
    <filter id="blurFilter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.04" />
    </filter>

    <linearGradient 
     id="greenyellowblack" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" style="stop-color: greenyellow;"></stop>
      <stop offset="100%" style="stop-color: purple;"></stop>
        </linearGradient>

        <g id="eye">
          <!-- размер g равен минимульаному вмместительной рамке охвтывающей фигуры -->
          <!-- cy cx defalut or (unwrtiten) = 0 -->
          <circle cx="0" cy="0" r="0.5"  fill="lightblue" ></circle>
          <circle cx="0" cy="0" r="0.25" fill="black"     ></circle>
        </g>

    </defs>

  
  <rect id="rect" x="5" y="2.5" height="5"  fill="black"></rect>

  <use href="#eye" x="4" y="1"></use>
  <use href="#eye" x="60%" y="1"></use>

  <circle id="cercle1" r="2.5" cx="4" cy="5">
    <!-- может работать как в ключевых кадрах from="2.5" 
      to="3"  или через вальюс 
    можно задать длительность отметок через  keyTimes="0; 0.5; 1"  -->
    <animate
      attributeName="r"
      
      values="2.5; 3; 2.5"
      dur="2s"
      repeatCount="indefinite"
      >
    </animate>
  </circle>
  <!-- центрирование текста по горизонтали работает в сязке двух атрибутов первый 
  икс посередине и анкор мидл -->
  <text x="5" text-anchor="middle" y="5" font-family="raleway" font-weight="300" filter="url(#blurFilter)" font-size="1" fill="black" >
    Это пример текста в SVG
  </text>
</svg>

</div>

</body>
<script>
  // не забываем что масштабируется по типу контейн  те большая ширина умножается на больший коэфициент мшстабирования
  document.querySelector('#rect').setAttribute('width', 5/ (window.innerHeight/window.innerWidth) )
</script>
</html>
