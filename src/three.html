    function createGradientTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth; // Широкий градиент
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0); // по горизонтали


    gradient.addColorStop(0, '#D3CCE3');      // первый цвет — с самого начала
gradient.addColorStop(0.6, '#D3CCE3');    // почти до 90% оставляем первый цвет

// Второй цвет — появляется только в последних 10%
// gradient.addColorStop(0., '#8E2DE2');   // резко смена цвета после 90%
gradient.addColorStop(1, '#8E2DE2');   

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

    textGeometry.center();

    const bbox = textGeometry.boundingBox;
const size = new THREE.Vector3();
bbox.getSize(size);

const uvs = textGeometry.attributes.uv;
const positions = textGeometry.attributes.position;

for (let i = 0; i < uvs.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);

    const u = (x - bbox.min.x) / size.x; // от 0 до 1 по X
    const v = (y - bbox.min.y) / size.y; // от 0 до 1 по Y

    uvs.setXY(i, u, v);
}
uvs.needsUpdate = true;
